<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Creative Platform &amp; Interiors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #0b0507;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.5);
      --border-color: rgba(255, 255, 255, 0.15);
      --accent-pink: #ff3385;
      --pill-bg: rgba(255, 255, 255, 0.04);
      --pill-border: rgba(255, 255, 255, 0.12);
      --pill-active-bg: #ffffff;
      --pill-active-text: #0b0507;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      padding: 2.5rem 4rem;
    }

    /* Top Navigation matching index.html style */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto 5rem;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-links-center {
      display: flex;
      gap: 3rem;
      list-style: none;
    }

    .nav-links-center a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links-center a:hover {
      color: var(--accent-pink);
    }

    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .contact-nav-link {
      text-decoration: none;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .clock-display {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* Main Contact Container */
    .contact-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4rem;
      padding-bottom: 6rem;
    }

    /* Section: Interested In */
    .section-title {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1.75rem;
      color: var(--text-main);
    }

    .pills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .pill-btn {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: rgba(255, 255, 255, 0.85);
      padding: 0.85rem 1.6rem;
      border-radius: 9999px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .pill-btn:hover {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .pill-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
      font-weight: 700;
    }

    /* Form Fields */
    .form-fields-group {
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .minimal-input, .minimal-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 0;
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.5vw, 2.2rem);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.25s;
    }

    .minimal-input::placeholder, .minimal-textarea::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .minimal-input:focus, .minimal-textarea:focus {
      border-color: var(--accent-pink);
    }

    .minimal-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Budget Section */
    .budget-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .budget-label {
      font-size: clamp(1.5rem, 2.5vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.35);
    }

    /* Direct Contact Info Block */
    .direct-contact-block {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .block-headline {
      font-size: clamp(2rem, 3.5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .block-headline a {
      color: var(--text-main);
      text-decoration: underline;
      text-underline-offset: 8px;
      transition: color 0.2s;
    }

    .block-headline a:hover {
      color: var(--accent-pink);
    }

    .contact-methods {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    .contact-methods a {
      color: var(--text-main);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .contact-methods a:hover {
      color: var(--accent-pink);
    }

    /* Footer matching dark theme */
    .footer-wrapper {
      width: 100%;
      max-width: 1400px;
      margin: 4rem auto 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 500;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 2rem;
    }

    .footer-left-links, .footer-right-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .footer-right-links {
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
    }

    .footer-left-links a, .footer-right-links a {
      text-decoration: none;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .footer-left-links a:hover, .footer-right-links a:hover {
      color: var(--text-main);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      body { padding: 1.5rem; }
      .nav-links-center { display: none; }
      .footer-wrapper { flex-direction: column; gap: 2rem; align-items: flex-start; }
      .footer-right-links { align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="nav-header">
    <a href="index.html" class="brand-logo">CREATIVE.</a>
    <ul class="nav-links-center">
      <li><a href="index.html#services">SERVICES</a></li>
      <li><a href="index.html">PROJECTS</a></li>
    </ul>
    <div class="nav-right-group">
      <a href="contact.html" class="contact-nav-link" style="color: var(--accent-pink);">CONTACT US</a>
      <div class="clock-display" id="liveClock">12:12:40</div>
    </div>
  </header>

  <!-- Main Contact Content -->
  <main class="contact-container">
    <form id="contactForm" onsubmit="event.preventDefault();">
      
      <!-- Interested In Section -->
      <div style="margin-bottom: 4rem;">
        <h2 class="section-title">I'm interested in...</h2>
        <div class="pills-grid" id="interestPills">
          <button type="button" class="pill-btn" data-value="Branding">Branding</button>
          <button type="button" class="pill-btn" data-value="Web design">Web design</button>
          <button type="button" class="pill-btn" data-value="App design">App design</button>
          <button type="button" class="pill-btn" data-value="Web development">Web development</button>
          <button type="button" class="pill-btn" data-value="iOS app development">iOS app development</button>
          <button type="button" class="pill-btn" data-value="HTML/CSS coding">HTML/CSS coding</button>
          <button type="button" class="pill-btn" data-value="Vue/UI">Vue/UI</button>
          <button type="button" class="pill-btn" data-value="Logo design">Logo design</button>
          <button type="button" class="pill-btn" data-value="Site from scratch">Site from scratch</button>
          <button type="button" class="pill-btn" data-value="App from scratch">App from scratch</button>
          <button type="button" class="pill-btn" data-value="Shopify">Shopify</button>
          <button type="button" class="pill-btn" data-value="WordPress">WordPress</button>
          <button type="button" class="pill-btn" data-value="Graphic design">Graphic design</button>
          <button type="button" class="pill-btn" data-value="Creative direction">Creative direction</button>
          <button type="button" class="pill-btn" data-value="Photography">Photography</button>
          <button type="button" class="pill-btn" data-value="Advertise with us">Advertise with us</button>
        </div>
      </div>

      <!-- Text Inputs Group -->
      <div class="form-fields-group">
        <div class="input-row">
          <input type="text" class="minimal-input" placeholder="Your name" required>
        </div>
        
        <div class="input-row">
          <input type="email" class="minimal-input" placeholder="Your email" required>
        </div>

        <div class="input-row">
          <textarea class="minimal-textarea" placeholder="Tell us about your project" required></textarea>
        </div>
      </div>

      <!-- Budget Section -->
      <div class="budget-section" style="margin-top: 4rem;">
        <div class="budget-label">Project budget (USD)</div>
        <div class="pills-grid" id="budgetPills">
          <button type="button" class="pill-btn" data-budget="2-5k">2-5k</button>
          <button type="button" class="pill-btn" data-budget="5-10k">5-10k</button>
          <button type="button" class="pill-btn" data-budget="10-20k">10-20k</button>
          <button type="button" class="pill-btn" data-budget="20-40k">20-40k</button>
          <button type="button" class="pill-btn" data-budget="> 40k">> 40k</button>
        </div>
      </div>

      <!-- Direct CTA Section -->
      <div class="direct-contact-block" style="margin-top: 5rem;">
        <h2 class="block-headline">Have a project idea?<br><a href="#start">Start here.</a></h2>
        <div class="contact-methods">
          <div>email us <a href="mailto:digital@prixa.org">digital@prixa.org</a></div>
          <div>schedule a call <a href="https://calendly.com" target="_blank">calendly</a></div>
        </div>
      </div>

    </form>
  </main>

  <!-- Footer -->
  <footer class="footer-wrapper">
    <ul class="footer-left-links">
      <li><a href="#magazine">MAGAZINE</a></li>
      <li><a href="#jobs">JOBS</a></li>
    </ul>
    <ul class="footer-right-links">
      <li><a href="https://instagram.com" target="_blank">INSTAGRAM</a></li>
      <li><a href="https://tiktok.com" target="_blank">TIKTOK</a></li>
      <li><a href="https://twitter.com" target="_blank">TWITTER</a></li>
      <li><a href="https://github.com" target="_blank">GITHUB</a></li>
    </ul>
  </footer>

  <script>
    // Live Clock functionality
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const clockElement = document.getElementById('liveClock');
      if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}:${seconds}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Toggle pill buttons behavior for interests (multi-select)
    const interestPills = document.querySelectorAll('#interestPills .pill-btn');
    interestPills.forEach(pill => {
      pill.addEventListener('click', () => {
        pill.classList.toggle('active');
      });
    });

    // Toggle pill buttons behavior for budget (single select)
    const budgetPills = document.querySelectorAll('#budgetPills .pill-btn');
    budgetPills.forEach(pill => {
      pill.addEventListener('click', () => {
        budgetPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
      });
    });
  </script>
</body>
</html>
