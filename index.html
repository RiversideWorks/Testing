<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moving Eye Button</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f7;
    font-family: Arial, Helvetica, sans-serif;
}


/* BUTTON */

.copy-button {
    height: 48px;
    padding: 0 12px 0 18px;
    background: #000;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 12px 20px rgba(0,0,0,0.18);
    transition: transform .25s ease;
}

.copy-button:hover {
    transform: translateY(-2px);
}


/* EYES HOLDER */

.eyes {
    display: flex;
    gap: 8px;
}


/* WHITE EYE */

.eye {
    width: 27px;
    height: 27px;
    background: white;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
}


/* BLACK PUPIL */

.pupil {
    width: 10px;
    height: 10px;
    background: black;
    border-radius: 50%;
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    transition: transform .08s linear;
}

</style>

</head>


<body>


<div class="copy-button">

    <span>Click to Copy</span>

    <div class="eyes">

        <div class="eye">
            <div class="pupil"></div>
        </div>

        <div class="eye">
            <div class="pupil"></div>
        </div>

    </div>

</div>



<script>


const pupils = document.querySelectorAll(".pupil");


document.addEventListener("mousemove", (event)=>{


    pupils.forEach(pupil=>{


        const eye = pupil.parentElement;

        const eyeRect = eye.getBoundingClientRect();


        // Eye centre

        const eyeX = eyeRect.left + eyeRect.width / 2;
        const eyeY = eyeRect.top + eyeRect.height / 2;


        // Cursor direction

        const angle = Math.atan2(
            event.clientY - eyeY,
            event.clientX - eyeX
        );


        // Maximum pupil movement

        const distance = 6;


        const moveX = Math.cos(angle) * distance;
        const moveY = Math.sin(angle) * distance;


        pupil.style.transform =
        `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;


    });


});

</script>


</body>
</html>
